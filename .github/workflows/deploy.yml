name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing by pushing a gh-pages branch needs nothing but write access to the
# repo. The newer actions/deploy-pages route would additionally require the Pages
# site to already exist, and GITHUB_TOKEN isn't allowed to create one.
permissions:
  contents: write

# Serialise deploys; two force-pushes racing on gh-pages is not worth debugging.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The physics suite runs in ~2s, so there's no reason not to gate the
      # deploy on it. `npm run build` also typechecks before bundling.
      - run: npm test
      - run: npm run build

      - name: Publish dist to the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Pages runs output through Jekyll unless told not to, which silently
          # drops any file or directory whose name starts with an underscore.
          touch dist/.nojekyll
          cd dist
          # A fresh orphan history each time, force-pushed: the branch only ever
          # holds the current build instead of growing without bound.
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push --force --quiet \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
